[workspace]
resolver = "2"
members = ["common", "implant", "server", "tui"]

[workspace.package]
# 0.2.0 gates the empty-poll 204 on the teamserver (implants report
# their version at REGISTER; older builds keep receiving sealed empty
# batches) and the cookie-carried session token.
version = "0.2.1"
edition = "2021"
authors = ["Anthony Sforzin"]
license = "MIT"

# Operational-artifact hygiene (ABR-T023): no symbol table (removes the
# PDB path from the debug directory), whole-program LTO with one codegen
# unit, and abort-on-panic (unwind machinery and panic paths gone).
# cargo ignores `panic` for test targets with a warning, so test runs
# keep unwinding.
[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
