title: .NET Assembly Dropped to Temp Directory by Non-Installer Process (ABR-T025)
id: 5d8c3f7b-9e41-4c26-8d5a-1f7b6e9a3c04
status: experimental
description: >
  Detects the disk flash of in-process .NET assembly execution: a DLL
  written under the user temp directory by a process that is not a
  typical installer/updater/browser. The CLR keeps such files mapped
  without FILE_SHARE_DELETE, so the artifact persists after the task
  and is recoverable verbatim. Correlate with a subsequent clr.dll
  image load (Sysmon EID 7) in the same process for the
  high-fidelity hunt. Maps to Abraham technique ABR-T025.
references:
  - https://attack.mitre.org/techniques/T1620/
  - https://github.com/sforzin/abraham/blob/main/registry/techniques.yaml
author: Anthony Sforzin
date: 2026/09/12
tags:
  - attack.execution
  - attack.t1620
logsource:
  category: file_create
  product: windows
detection:
  selection:
    Image|endswith:
      - '\abraham-implant.exe'
    TargetFilename|contains: '\AppData\Local\Temp\'
    TargetFilename|endswith: '.dll'
  condition: selection
falsepositives:
  - Legitimate software dropping DLLs into its own temp directory
    (the image-name leg is lab-specific; generalize by removing it and
    filtering common installers/updaters for broader hunting)
level: high
