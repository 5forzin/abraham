title: Microsoft-Revoked Driver Load Attempt (ABR-T017)
id: 9c3d4e5f-8a1b-4c2d-a3e4-5f6a7b8c9d01
status: experimental
description: >
  Detects CodeIntegrity event 3023 - a driver load blocked because the
  driver has been revoked by Microsoft. Only revoked drivers produce
  this event; every attempt is a page-worthy signal even on non-HVCI
  hosts (lab-verified on build 26200: still-signed vulnerable drivers
  such as RTCore64 produce ZERO CodeIntegrity events, revoked ones
  produce 3023 + 3077 + 3089). Maps to Abraham technique ABR-T017
  (iqvw64e/KdMapper-family staging attempt).
references:
  - https://www.loldrivers.io/
  - https://github.com/TheCruZ/kdmapper
  - https://github.com/sforzin/abraham/blob/main/docs/detections/abr-t017.md
author: Anthony Sforzin
date: 2026/09/11
tags:
  - attack.t1068
logsource:
  product: windows
  service: microsoft-windows-codeintegrity/operational
detection:
  selection:
    EventID: 3023
  condition: selection
falsepositives:
  - None known - Microsoft's revoked-driver list is explicit.
level: critical
