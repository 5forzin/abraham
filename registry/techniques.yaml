schema_version: 1

registry:
  name: Abraham Technique Registry
  description: >
    Single source of truth for every offensive capability implemented in
    Abraham. A technique without a mapped detection artifact is not merged.

techniques:
  - id: ABR-T001
    name: Encrypted C2 channel over HTTPS
    description: >
      The implant establishes an end-to-end encrypted session (X25519 ECDHE
      handshake, HKDF-SHA256 key derivation, AES-256-GCM framing) tunneled
      inside HTTPS to the teamserver listener.
    mitre_attack:
      - T1071.001
      - T1573
    component: implant::transport
    phase: 1
    status: experimental
    lab_validated: 2026-09-10
    detections:
      - type: guidance
        path: docs/detections/abr-t001.md
        status: experimental

  - id: ABR-T002
    name: Remote command execution via cmd.exe
    description: >
      The implant executes operator tasks by spawning cmd.exe and returning
      stdout/stderr as a task result.
    mitre_attack:
      - T1059.003
    component: implant::exec
    phase: 1
    status: experimental
    lab_validated: 2026-09-10
    detections:
      - type: sigma
        path: detections/sigma/abr-t002_suspicious_cmd_parent.yml
        status: experimental

  - id: ABR-T003
    name: Implant file upload and download
    description: >
      The implant writes operator-delivered payloads to user-writable paths
      (upload) and exfiltrates files back to the teamserver (download).
    mitre_attack:
      - T1105
    component: implant::fs
    phase: 1
    status: experimental
    lab_validated: 2026-09-10
    detections:
      - type: sigma
        path: detections/sigma/abr-t003_executable_written_to_user_path.yml
        status: experimental

  - id: ABR-T004
    name: Jittered task polling
    description: >
      The implant polls the teamserver for tasks on a configurable sleep
      interval with randomized jitter to mimic irregular interactive traffic.
    mitre_attack:
      - T1071.001
    component: implant::transport
    phase: 1
    status: experimental
    lab_validated: 2026-09-10
    detections:
      - type: guidance
        path: docs/detections/abr-t004.md
        status: experimental

  - id: ABR-T005
    name: Indirect syscalls
    description: >
      The implant resolves system service numbers from ntdll at runtime and
      invokes NT APIs through a syscall;ret gadget inside ntdll, avoiding the
      normal exported user-mode syscall entry point.
    mitre_attack:
      - T1106
    component: implant::evasion::syscalls
    phase: 2
    status: experimental
    lab_validated: 2026-09-11
    detections:
      - type: guidance
        path: docs/detections/abr-t005.md
        status: experimental

  - id: ABR-T006
    name: Ekko-style sleep obfuscation
    description: >
      The implant uses waitable-timer APC completion routines to make its
      executable section writable, encrypt it with RC4 while dormant, restore
      the plaintext and executable protection, and then resume execution.
    mitre_attack:
      - T1027
      - T1497.003
    component: implant::evasion::sleep
    phase: 2
    status: experimental
    lab_validated: 2026-09-11
    detections:
      - type: guidance
        path: docs/detections/abr-t006.md
        status: experimental

  - id: ABR-T007
    name: PPID spoofing with child-process DLL restrictions
    description: >
      The implant creates command shells with explorer.exe as their reported
      parent through PROC_THREAD_ATTRIBUTE_PARENT_PROCESS and applies a
      mitigation policy that blocks non-Microsoft-signed DLLs in the child.
    mitre_attack:
      - T1134.004
    component: implant::evasion::spoof
    phase: 2
    status: experimental
    lab_validated: 2026-09-11
    detections:
      - type: sigma
        path: detections/sigma/abr-t007_cmd_via_explorer.yml
        status: experimental
      - type: guidance
        path: docs/detections/abr-t007.md
        status: experimental

  - id: ABR-T008
    name: Dynamic unwind metadata for unbacked code
    description: >
      The implant registers RUNTIME_FUNCTION/UNWIND_INFO entries through
      RtlAddFunctionTable for its hand-assembled routines on private
      executable pages, so stack walks restore those frames' real contexts
      like legitimate JIT code instead of misattributing them as leaf
      frames and derailing onto the routines' parked stack data.
      Concept adapted from the Morgana prototype.
    mitre_attack:
      - T1027
    component: implant::evasion::unwind
    phase: 2
    status: experimental
    lab_validated: 2026-09-11
    detections:
      - type: guidance
        path: docs/detections/abr-t008.md
        status: experimental

  - id: ABR-T009
    name: Pristine syscall numbers from KnownDlls
    description: >
      The implant maps \KnownDlls\ntdll.dll read-only through indirect
      NtOpenSection/NtMapViewOfSection syscalls and reads untouched
      syscall stubs from that view, falling back to it when the local
      ntdll stubs and all their neighbours are hooked. No disk read is
      involved. Concept adapted from the Morgana prototype.
    mitre_attack:
      - T1562.001
      - T1106
    component: implant::evasion::syscalls
    phase: 2
    status: experimental
    lab_validated: 2026-09-11
    detections:
      - type: guidance
        path: docs/detections/abr-t009.md
        status: experimental

  - id: ABR-T010
    name: Call-stack spoofing for indirect syscalls
    description: >
      The implant dispatches syscalls with rsp pivoted to a synthetic
      stack whose frames are return addresses into kernel32/ntdll anchor
      functions, placed at the exact offsets a stack walker computes from
      those functions' real unwind metadata, so telemetry stack walks
      attribute every frame to system modules instead of the implant
      image. Degrades to the plain indirect dispatcher when a user-mode
      shadow stack is enforced. Concept adapted from the Morgana
      prototype.
    mitre_attack:
      - T1027
    component: implant::evasion::stack
    phase: 2
    status: experimental
    lab_validated: 2026-09-11
    detections:
      - type: guidance
        path: docs/detections/abr-t010.md
        status: experimental
  - id: ABR-T011
    name: In-process task modules
    description: >
      The implant executes routine collection (process enumeration via
      NtQuerySystemInformation, directory listing, capped file read,
      self-identification) as built-in modules inside its own process on
      the session thread, dispatching NT calls through the indirect
      syscall layer with a spoofed call stack. No child processes, no
      new threads, no console hosts.
    mitre_attack:
      - T1106
      - T1082
    component: implant::modules
    phase: 2
    status: experimental
    lab_validated: 2026-09-11
    detections:
      - type: guidance
        path: docs/detections/abr-t011.md
        status: experimental
  - id: ABR-T012
    name: Phantom DLL stomping for the code home
    description: >
      The implant maps a signed System32 DLL as an image section through
      direct syscalls without the loader, carves its ekko routines and
      dynamic unwind metadata out of the DLL's .text via copy-on-write
      flips, and executes them from a MEM_IMAGE region named after the
      legitimate file — removing the MEM_PRIVATE executable-memory
      tripwire while staying absent from the module list.
    mitre_attack:
      - T1027
      - T1106
    component: implant::evasion::stomp
    phase: 2
    status: experimental
    lab_validated: 2026-09-11
    detections:
      - type: guidance
        path: docs/detections/abr-t012.md
        status: experimental
  - id: ABR-T013
    name: Kernel-driver staging lifecycle via the SCM
    description: >
      The implant copies a driver file to a staging path, registers a
      demand-start kernel service on it through OpenSCManagerW /
      CreateServiceW / StartServiceW resolved via the manual export walk,
      and starts it — or stops, deregisters and deletes it. Stage 3.1 of
      the BYOVD chain, exercised against benign signed drivers (a copy of
      null.sys) before any vulnerable driver is involved. The full
      footprint (service install with an ImagePath outside
      System32\drivers, driver load of the staged file, Type=1 service
      registry key) is deliberate detection material.
    mitre_attack:
      - T1543.003
      - T1068
    component: implant::driver
    phase: 3
    status: experimental
    lab_validated: 2026-09-11
    detections:
      - type: guidance
        path: docs/detections/abr-t013.md
        status: experimental
      - type: sigma
        path: detections/sigma/abr-t013_driver_service_imagepath_outside_system32.yml
        status: experimental
  - id: ABR-T014
    name: Kernel read/write via operator-supplied vulnerable driver
    description: >
      The implant opens the device of a vulnerable signed driver staged
      by the operator over C2 upload and loaded through the ABR-T013
      lifecycle, then speaks its protocol for arbitrary kernel virtual
      read/write. Shipped client: RTCore64 (CVE-2019-16098 family,
      48-byte METHOD_BUFFERED struct, IOCTLs 0x80002048/0x8000204C);
      the client surface is pluggable per driver. The probe action
      proves the primitive by leaking the ntoskrnl base through spoofed
      NtQuerySystemInformation(SystemModuleInformation) and reading its
      MZ header through the driver. No vulnerable driver binaries in
      this repository, ever.
    mitre_attack:
      - T1068
    component: implant::vdm
    phase: 3
    status: experimental
    lab_validated: 2026-09-11
    detections:
      - type: guidance
        path: docs/detections/abr-t014.md
        status: experimental
      - type: sigma
        path: detections/sigma/abr-t014_rtcore64_driver_load.yml
        status: experimental

  - id: ABR-T015
    name: EPROCESS token swap via kernel write primitive
    description: >
      With the ABR-T014 kernel read/write primitive live, the implant
      resolves PsInitialSystemProcess through ntoskrnl's in-memory
      export table, walks ActiveProcessLinks to its own EPROCESS with
      offset sanity checks (System PID == 4, own PID match, EX_FAST_REF
      shape), swaps its token slot for the System token, proves SYSTEM
      in-process via the SAM hive DACL and restores the original
      token. No native telemetry exists for the swap itself; the
      detection guidance keys on the prerequisite chain and token
      sweeps. Experimental: first live attempt bugchecked the lab
      (0x3B, see docs/lab/2026-09-11-byovd-phase3.md Part 4); retry
      gated on a VM snapshot.
    mitre_attack:
      - T1134
      - T1068
    component: implant::vdm
    phase: 3
    status: experimental
    lab_validated: 2026-09-11
    detections:
      - type: guidance
        path: docs/detections/abr-t015.md
        status: experimental

  - id: ABR-T016
    name: DKOM process hiding via kernel write primitive
    description: >
      The implant discovers every GLOBAL process list inside the System
      EPROCESS by structural signature (circular walk passing its own
      PID, list length matching the live SystemProcessInformation
      count - the discriminator that excludes session/job/thread lists,
      whose unlink corrupts kernel-audited state), unlinks its own
      EPROCESS from each with verified neighbor updates, and can relink
      with a guarded restore that refuses stale neighbors. Lab-verified
      round-trip on build 26200; documented 2026 limitation: 24H2+
      tasklist/PSI enumerate via PspAllProcess, so classic DKOM no
      longer hides from them - the enumeration-source diff that this
      enables is the technique's own detection.
    mitre_attack:
      - T1564.008
      - T1014
    component: implant::vdm
    phase: 3
    status: experimental
    lab_validated: 2026-09-11
    detections:
      - type: guidance
        path: docs/detections/abr-t016.md
        status: experimental

  - id: ABR-T017
    name: Kernel function calls via call-capable driver (iqvw64e client)
    description: >
      Kernel code-execution capability over the driver shortlist. Two
      paths: the iqvw64e/Nal client (arbitrary kernel/user memcpy,
      VA-to-PA, MmMapIoSpace RX-bypass writes, kernel CALL via a
      movabs-jmp stub over nt!NtAddAtom) for hosts where that driver
      loads, and the dual-driver RTCore64+WinIo64 proof for current
      builds where every famous certificate is revoked but WinIo still
      loads: WinIo maps the physical frame behind RTCore64s
      runtime-read-only INIT section as a fresh RW view, the v1b
      dispatch-table stub lands there, and NtQueryIntervalProfile fires
      it in kernel context with full restore. System CR3 discovered
      structurally (the 24H2 KPROCESS restructure retired the classic
      +0x28 table). Revoked-driver attempts (iqvw64e, gdrv, MsIo64)
      fail 0x800B010C with CodeIntegrity 3023/3077/3089 - enforced
      independent of HVCI, test-signing and trust-list tampering (lab
      Parts 8-9). The dual-driver CALL is not lab-validated: three live
      runs reproduced 0x1A/0x61941, and a fourth read-only preflight run
      reproduced it before any write or kernel trigger. Both dual-driver
      actions now fail closed pending exact-driver ABI validation and a
      dump-backed root cause.
    mitre_attack:
      - T1068
    component: implant::vdm
    phase: 3
    status: experimental
    detections:
      - type: guidance
        path: docs/detections/abr-t017.md
        status: experimental
      - type: sigma
        path: detections/sigma/abr-t017_revoked_driver_load_attempt.yml
        status: experimental

  - id: ABR-T018
    name: KDMapper-style unsigned-driver mapping via iqvw64e
    description: >
      Kernel code execution by manual mapping: with the signed Intel
      "Nal" driver (iqvw64e.sys) loaded through the SCM, an unsigned
      driver PE is allocated into NonPagedPool via a real
      ExAllocatePoolWithTag call through the NtAddAtom trampoline,
      staged entirely in implant memory (sections, DIR64 relocations,
      imports resolved against the live kernel export tables of the
      NtQuerySystemInformation module list), copied in with readback
      verification, and its DriverEntry invoked through the call
      primitive. No payload service, no payload file on disk, no
      signature event for the mapped image. The builtin proof payload
      is generated in memory (import call + relocated absolute
      reference + magic stamp into a caller-supplied kernel scratch
      buffer) and its semantics are unit-tested by executing it in a
      usermode RWX view through the same staging code. Depends on the
      Microsoft Vulnerable Driver Blocklist being disabled (stock
      24H2 rejects the loader with 0x800B010C / CodeIntegrity
      3023-family - lab Parts 8-9); detection therefore anchors on the
      loader (EID 7045/6, hash-matched) and on the CI\Config switch.
      Port of the reference flow (TheCruZ/kdmapper MapDriver +
      intel_driver.cpp) with Abraham safety additions: abort on
      unsupported relocation types, abort on unresolved imports (no
      nullstubs), pool free on every early return, readback check
      before the entry call.
    mitre_attack:
      - T1068
      - T1543.003
    component: implant::mapper
    phase: 3
    status: stable
    lab_validated: 2026-09-12
    detections:
      - type: guidance
        path: docs/detections/abr-t018.md
        status: experimental
      - type: sigma
        path: detections/sigma/abr-t018_iqvw64e_kdmapper_driver_load.yml
        status: experimental

  - id: ABR-T019
    name: Module DKOM on PsLoadedModuleList + serviceless loader
    description: >
      Driver-stage evasiveness. The SCM load deregisters the service
      and deletes the staged file immediately after a successful start
      (KDMapper parity): the image stays mapped, the device answers,
      and `sc query`/Get-Service/the Services registry show nothing
      (EID 7045 at install time remains the irreducible signal). On
      top of that, DKOM unlinks the loader's KLDR_DATA_TABLE_ENTRY
      from nt!PsLoadedModuleList (InLoadOrderLinks; BaseDllName
      matched at +0x58/+0x60; neighbors saved for a guarded relink) -
      every enumeration built on that list goes blind. Runs over the
      client-agnostic RwClient surface (iqvw64e preferred, RTCore64
      fallback). Restores refuse stale relinks exactly like the
      process DKOM (ABR-T016).
    mitre_attack:
      - T1014
      - T1562.001
    component: implant::vdm
    phase: 3
    status: stable
    lab_validated: 2026-09-12
    detections:
      - type: guidance
        path: docs/detections/abr-t019.md
        status: experimental
  - id: ABR-T020
    name: EPROCESS.Protection spoof (protected-process anti-kill)
    description: >
      Copies the SYSTEM process's EPROCESS.Protection byte onto the
      implant: termination attempts from every unprotected context
      (admin taskkill, PowerShell Stop-Process, most EDR
      kill-switches) return ACCESS DENIED while the process keeps
      running. The offset is confirmed at runtime against three
      references (System and winlogon must hold plausible
      Signer/Type nibbles, the implant must read unprotected) before
      any write; the write is a qword read-modify-write with
      readback. `protect off` restores the saved byte. Runs over
      RwClient (iqvw64e preferred).
    mitre_attack:
      - T1055.012
      - T1562.001
    component: implant::vdm
    phase: 3
    status: stable
    lab_validated: 2026-09-12
    detections:
      - type: guidance
        path: docs/detections/abr-t020.md
        status: experimental

  - id: ABR-T021
    name: Resident km payload with covert channel and kernel-side self-protection
    description: >
      Our own unsigned kernel driver, mapped resident through the
      KDMapper path (ABR-T018): payloads/abraham-km is freestanding
      Rust with ZERO PE imports, linked by rust-lld as a native driver
      (/SUBSYSTEM:NATIVE /ENTRY:DriverEntry) - no WDK, no MSVC env, no
      SCM. The mapper provisions the covert channel at map time:
      param1 = zeroed shared NonPagedPool block (magic, implant pid,
      and the live-discovered EPROCESS offsets pre-filled), param2 =
      kernel function table (KeInitializeTimer/KeInitializeDpc/
      KeSetTimerEx/KeCancelTimer addresses plus the
      PsInitialSystemProcess data-export address). A 2s timer DPC owns
      a heartbeat the implant polls through the iqvw64e read
      primitive (no device, no IRP, no handles, no named objects) and
      a command protocol: ping, protect <pid>, unprotect, stop. While
      protect is active, EVERY tick re-copies the SYSTEM process's
      EPROCESS.Protection byte onto the target - self-healing
      anti-kill that survives usermode resets and keeps working even
      if the implant dies. Detection anchors on the loader chain
      (EID 7045/iqvw64e, ABR-T018/T019) and on pool-resident
      driver-less code (no image entry, callbacks/timers with no
      module).
    mitre_attack:
      - T1543.003
      - T1055.012
    component: implant::mapper
    phase: 3
    status: stable
    lab_validated: 2026-09-12
    detections:
      - type: guidance
        path: docs/detections/abr-t021.md
        status: experimental

  - id: ABR-T022
    name: In-process shellcode execution without a child process or thread
    description: >
      The EXEC task (task_type 0x08) runs position-independent
      operator payloads inside the implant: RW allocation via
      NtAllocateVirtualMemory (indirect syscalls, spoofed stack),
      volatile copy, NtProtectVirtualMemory flip to RX, a direct call
      as fn(usize) -> usize ON THE SESSION THREAD (preserving the
      single-thread invariant sleep obfuscation relies on), then
      NtFreeVirtualMemory - the region never coexists writable and
      executable and never outlives the task. No child process, no
      CreateRemoteThread, no cross-process handle: Sysmon EID 8/10
      stay dark by construction. Payload capped at 48 KB by the frame
      ceiling; shellcode that never returns parks the beacon (stagers
      that return are the intended shape). Detection is kernel-memory
      ETW (RW to RX flip on an unbacked private region, no loader
      involvement) and private-RX region scanning while the stage is
      resident.
    mitre_attack:
      - T1055.012
      - T1620
    component: implant::execshc
    phase: 4
    status: stable
    lab_validated: 2026-09-12
    detections:
      - type: guidance
        path: docs/detections/abr-t022.md
        status: experimental

  - id: ABR-T023
    name: Operational build hardening - compiled-in configuration and artifact hygiene
    description: >
      Operational artifacts embed the deployment configuration at
      build time (ABRAHAM_EMBED JSON: server, key, tls pin, evasion
      flags, malleable profile) under a build-random XOR keystream,
      decoded through volatile reads so LTO cannot constant-fold the
      plaintext into .rdata (fold observed and fixed). The CLI parser,
      stderr logging and project strings exist only behind the
      lab-args/lab-log features: operational builds carry zero
      project-name/flag/log/PDB strings, no builder identity
      (remap-path-prefix), abort silently on panic, and reconnect with
      doubling backoff instead of a fixed interval. The paired
      detection is the surface this removes where it is still present:
      legacy/lab builds expose the whole C2 configuration on the
      process command line (Sysmon EID 1, sigma rule).
    mitre_attack:
      - T1027.013
      - T1071.001
    component: implant::main
    phase: 4
    status: stable
    lab_validated: 2026-09-12
    detections:
      - type: sigma
        path: detections/sigma/abr-t023_implant_cli_flags.yml
        status: experimental
      - type: guidance
        path: docs/detections/abr-t023.md
        status: experimental

  - id: ABR-T024
    name: In-process AMSI and ETW patching before managed execution
    description: >
      Neutralizes the two user-mode instrumentation layers of the
      implant's own process before running attacker-controlled managed
      code: amsi.dll!AmsiScanBuffer is rewritten to `mov eax,
      0x80070057; ret` (every scan reports E_INVALIDARG and succeeds)
      and ntdll!EtwEventWrite to `xor eax, eax; ret` (events swallow).
      Pages flip RW through the indirect-syscall layer, are written
      via volatile stores, read back byte-exact and restored to their
      original protection; amsi.dll loads on demand through the manual
      export resolver (no IAT entry). Idempotent, no restore. Kernel
      ETW (TI provider) is unaffected - documented as the defense that
      outlives the patch.
    mitre_attack:
      - T1562.001
      - T1562.002
    component: implant::evasion::patch
    phase: 4
    status: stable
    lab_validated: 2026-09-12
    detections:
      - type: guidance
        path: docs/detections/abr-t024.md
        status: experimental

  - id: ABR-T025
    name: Execute-assembly through bare CLR hosting
    description: >
      Runs an operator-supplied .NET Framework assembly inside the
      implant with no powershell.exe and no dotnet.exe: bytes to a
      randomly named temp .dll, then mscoree!CLRCreateInstance ->
      ICLRMetaHost::GetRuntime(v4.0.30319) -> ICLRRuntimeInfo::
      GetInterface -> ICLRRuntimeHost::Start -> ExecuteInDefaultApp-
      Domain, invoking the operator convention `public static int
      Method(string)`. All COM entry points resolve through the manual
      export resolver; the vtable layouts follow the mingw-w64/wine
      headers exactly (ICLRRuntimeInfo::GetInterface slot 9,
      ICLRRuntimeHost Start slot 3 / ExecuteInDefaultAppDomain slot 11
      - pinned by a live unit test that compiles its own proof
      assembly with the in-box csc.exe). The CLR pins the temp file
      without FILE_SHARE_DELETE, so the residue is deleted, marked
      delete-on-close via NtSetInformationFile, or its path reported -
      the disk flash is the technique's irreducible telemetry and the
      paired detection anchor.
    mitre_attack:
      - T1620
      - T1055
    component: implant::clr
    phase: 4
    status: stable
    lab_validated: 2026-09-12
    detections:
      - type: sigma
        path: detections/sigma/abr-t025_clr_assembly_written_to_temp.yml
        status: experimental
      - type: guidance
        path: docs/detections/abr-t025.md
        status: experimental

  - id: ABR-T026
    name: In-process PowerShell execution with AMSI/ETW neutralized
    description: >
      The POWERSHELL task runs .ps1 scripts inside the implant's own
      CLR instance - no powershell.exe, no child process. The
      teamserver compiles tools/psboot.cs once with the in-box csc
      (mscorlib-only references; System.Management.Automation loads
      from the GAC at runtime through exact-signature reflection with
      manual overload selection - binder-based lookups are ambiguous
      against the generic Create/Invoke siblings) and ships the
      bootstrap with the task. The implant patches AMSI and ETW first
      (ABR-T024) - the runspace never sees a working AmsiScanBuffer
      and script-block/module logging (which rides EtwEventWrite) is
      silenced - then hosts/reuses the CLR (Start answers S_FALSE on
      an already-running runtime), runs Boot.Run with
      "<outpath>\n<script>", and returns the captured output.
      Detection anchors: SMA/clr image loads into a non-.NET host
      (sigma), memory scanning of the live script, the bootstrap disk
      flash (ABR-T025 residue rules), and absence-of-4104 hunting.
    mitre_attack:
      - T1059.001
      - T1562.001
    component: implant::clr
    phase: 4
    status: stable
    lab_validated: 2026-09-12
    detections:
      - type: sigma
        path: detections/sigma/abr-t026_sma_loaded_by_non_powershell.yml
        status: experimental
      - type: guidance
        path: docs/detections/abr-t026.md
        status: experimental

  - id: ABR-T027
    name: In-memory native PE execution with exit redirection
    description: >
      The RUNPE task maps an operator-supplied native x64 PE (.exe or
      .dll) inside the implant through a user-mode manual mapper:
      sections into a fresh RW allocation, DIR64 relocations (empty
      reloc directory on a moved image is legal - RIP-relative PEs
      with load-time IAT), imports against live modules through the
      manual export resolver, whole image flipped RX, entry point run
      on a dedicated RtlCreateUserThread thread waited synchronously
      on the session thread (ekko invariant preserved). The resolver
      redirects ExitProcess/TerminateProcess/RtlExitUserProcess/exit/
      _exit/_Exit to a 12-byte stub tail-jumping to the real
      ExitThread with the exit code in RCX - a console EXE cannot take
      the implant down. Transport: 48 KB inline; larger PEs via upload
      with the stage deleted right after mapping. Documented
      limitations (empirical): CRT/TLS payloads fault (no loader -
      TLS never materialized; no_std payloads are the supported shape),
      an entry's plain return is not the thread exit code, real PEB
      visible, no TLS callbacks, ordinal imports abort. Detection:
      unbacked full-PE RX private regions, LoadLibrary bursts without
      loader context, RtlCreateUserThread attribution on kernel ETW.
    mitre_attack:
      - T1055.012
      - T1620
    component: implant::runpe
    phase: 4
    status: stable
    lab_validated: 2026-09-12
    detections:
      - type: guidance
        path: docs/detections/abr-t027.md
        status: experimental

  - id: ABR-T035
    name: Malleable transport hardening - cookie demux, idle 204s, kill date, gates and front failover
    description: >
      Five transport-era tradecraft improvements shipped together
      (implant 0.2.0). (1) The session demux token moves from the
      X-Session header into a profile-named session cookie
      (Cookie: sid=<u64>, name from the malleable profile) - a session
      cookie is what web-fronted traffic normally carries, a custom
      header is not; the header remains accepted for pre-0.2.0 builds.
      (2) Idle TASK_POLLs answer HTTP 204 with no body - no sealed
      BATCH_END blob, so an idle beacon stops emitting a constant
      small binary POST/200 pair; gated on the implant build version
      reported at REGISTER so legacy builds keep the old envelope.
      (3) kill_date in the embedded config: past the unix timestamp
      the implant exits silently - dead tooling must not keep
      beaconing (SUNBURST-style expiry, also lab hygiene). (4)
      Environment gates: a random activation delay before first
      contact breaks the process-start to immediate-beacon
      correlation, and a blocked-process list keeps the implant
      dormant (name-only NtQuerySystemInformation polls through the
      indirect-syscall layer, no contact) on analyst/EDR workstations.
      (5) servers[] front failover: after 3 consecutive transport
      failures the implant rotates to the next configured front with
      the same session token, resuming into the same teamserver
      session. The embedded config itself becomes one encrypted JSON
      blob (schema in protocol.md 8.1) instead of five fixed string
      fields. Detection: numeric-only cookie values constant across
      requests, near-monotone POST->204 cadence, cross-front rotation
      joined by the cookie value, and the dormancy polling pattern
      (process enumeration without children or sockets).
    mitre_attack:
      - T1071.001
      - T1497.001
      - T1497.003
    component: implant::main
    phase: 4
    status: stable
    lab_validated: 2026-09-12
    detections:
      - type: guidance
        path: docs/detections/abr-t035.md
        status: experimental
