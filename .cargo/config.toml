# Build-path hygiene: panic locations and libyaml-style asserts
# otherwise embed absolute paths of the build machine (username included)
# into release artifacts. The remaps apply to every crate compiled in
# this workspace. The GitHub windows runner needs its own prefixes too
# (registry at C:\Users\runneradmin\.cargo, checkout at D:\a) or the
# static OPSEC audit fails on 'C:\Users'; unmatched mappings are
# harmless.
[target.x86_64-pc-windows-msvc]
rustflags = [
    "--remap-path-prefix=C:\\Users\\antho\\.cargo=/cargo",
    "--remap-path-prefix=C:\\Users\\antho\\abraham=/src",
    "--remap-path-prefix=C:\\Users\\runneradmin\\.cargo=/cargo",
    "--remap-path-prefix=D:\\a=/src-ci",
    # Strip the linker debug directory (RSDS + PDB path) from release
    # artifacts; cargo's `strip = "symbols"` does not remove it on MSVC.
    "-C",
    "link-arg=/DEBUG:NONE",
]
