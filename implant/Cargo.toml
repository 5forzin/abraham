[package]
name = "abraham-implant"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Laboratory/diagnostics surface. Release artifacts built WITHOUT these
# features carry no command-line parser, no stderr logging and none of
# their strings — operational configuration comes from the compiled-in
# profile (ABRAHAM_EMBED at build time, see build.rs).
default = []
lab-args = []
lab-log = ["lab-args"]

[dependencies]
abraham-common = { path = "../common" }
anyhow = "1"
ed25519-dalek = "2"
hex = "0.4"
# OS-native TLS (Schannel on Windows): the handshake is generated by the
# platform stack, so the ClientHello fingerprint matches ordinary Windows
# HTTPS traffic. Network DPI that holds non-browser TLS stacks (e.g. a
# rustls ClientHello with no GREASE) sees a normal Schannel flow instead.
# Authenticity does not depend on this layer — the inner Ed25519 handshake
# pins the server identity, and an optional SPKI/cert pin is checked
# against the peer certificate before any protocol bytes are sent.
native-tls = "0.2"
rand = "0.8"
# serde/serde_json: runtime parsing of the embedded configuration blob
# (single-blob embed since T035; build.rs still owns validation).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros"] }
tokio-native-tls = "0.3"

[build-dependencies]
serde_json = "1"
