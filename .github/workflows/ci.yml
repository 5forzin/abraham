name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate registry and detections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install pyyaml sigma-cli
      - name: Validate technique registry
        run: python tools/validate_registry.py
      - name: Validate Sigma rules
        run: sigma check detections/sigma

  build:
    name: Build and test workspace
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      # ABR-T023 gate: the operational artifact (release, no lab
      # features) must carry no project-identifying strings. This step
      # exists so a regression reintroducing them fails the build.
      - name: Artifact hygiene (release implant)
        run: cargo build --release -p abraham-implant
      - name: Static OPSEC audit
        shell: bash
        run: |
          python - <<'EOF'
          data = open('target/release/abraham-implant.exe','rb').read()
          banned = [b'abraham', b'Abraham', b'.pdb', b'--server', b'--evasion',
                    b'--tls-pin', b'usage:', b'evasion armed', b'session ended',
                    b'ppid spoof unavailable', b'C:\\Users']
          leaked = [p for p in banned if p in data]
          if leaked:
              print('LEAKED STRINGS:', leaked)
              raise SystemExit(1)
          print(f'artifact hygiene: clean ({len(data)} bytes, '
                f'{data.count(b"/rustc/")} inherent std toolchain paths)')
          EOF
